name: Manual sol verify
# Re-dispatching the idempotent deploy broadcasts nothing, so `--verify` cannot repair an unverified singleton; this can.
# Networks come from `[etherscan]` in `foundry.toml`.
on:
  workflow_dispatch:
jobs:
  verify:
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-verify.yaml@main
    with:
      contract: src/concrete/TOFUTokenDecimals.sol:TOFUTokenDecimals
      # `DEPLOYED_ADDRESS` in `src/generated/candidate/TOFUTokenDecimals.sol`; Zoltu gives one address on every network.
      address: '0x200e12D10bb0c5E4a17e7018f0F1161919bb9389'
    secrets: inherit
